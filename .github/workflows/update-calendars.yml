name: Update calendars

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:         # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build calendars
        run: python build_calendars.py
      - name: Commit changes
        if: always()  # still publish the calendars that succeeded if one source failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Update calendars" && git push)
